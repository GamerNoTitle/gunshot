name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - run: python3 scripts/prepare-core.py
      - run: go test -race -tags cli ./...
      - run: go test -tags cli app/backend
      - run: go vet -tags cli ./...
      - name: C ABI smoke
        run: |
          go build -tags cli -buildmode=c-archive -o .build/libgotohp.a ./cmd/bridge
          cc -I.build tests/bridge_smoke.c .build/libgotohp.a -lpthread -ldl -lm -o .build/bridge-smoke
          .build/bridge-smoke
  package:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, rootful, jailed]
    env:
      THEOS: ${{ github.workspace }}/.theos-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Install Theos and tools
        run: |
          brew install ldid dpkg
          git clone https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout 5280bd038207e14f8bd76f5417aa2fe641c03228
          git -C "$THEOS" submodule update --init --recursive
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          version=$(xcrun --sdk iphoneos --show-sdk-version)
          mkdir -p "$THEOS/sdks"
          ln -s "$sdk" "$THEOS/sdks/iPhoneOS${version}.sdk"
      - name: Native routing contract
        if: matrix.scheme == 'jailed'
        run: |
          mkdir -p .build
          clang -fobjc-arc -framework Foundation -Itests/native-shims UI/GSNativeRouting.m tests/native_routing.m -o .build/native-routing-test
          .build/native-routing-test
          clang -fobjc-arc -DGS_JAILED=1 -framework Foundation -Itests/native-shims UI/GSBackupRequests.m tests/backup_requests.m -o .build/backup-requests-test
          .build/backup-requests-test
          clang -fobjc-arc -framework Foundation UI/GSUploadDiagnostics.m tests/upload_diagnostics.m -o .build/upload-diagnostics-test
          .build/upload-diagnostics-test
          clang -fobjc-arc -framework Foundation UI/GSNativeAccount.m tests/native_account.m -o .build/native-account-test
          .build/native-account-test
          clang -fobjc-arc -framework Foundation -Itests/menu-shims -Itests/native-shims UI/GSAccountMenu.m tests/account_menu.m -o .build/account-menu-test
          .build/account-menu-test
      - name: UIKit settings presentation smoke
        if: matrix.scheme == 'jailed'
        timeout-minutes: 8
        run: bash scripts/test-settings-ui.sh
      - uses: actions/upload-artifact@v4
        if: matrix.scheme == 'jailed' && always()
        with:
          name: settings-ui-smoke
          path: .build/settings-ui-results/
          if-no-files-found: warn
      - name: Build Go archive and Debian package
        run: bash scripts/package.sh '${{ matrix.scheme }}'
      - name: Verify package layout
        run: python3 scripts/verify-package.py '${{ matrix.scheme }}'
      - uses: actions/upload-artifact@v4
        with:
          name: gotohp-tweak-${{ matrix.scheme }}
          path: |
            packages/*.deb
            packages/jailed/*.deb
            packages/jailed/*.dylib
            packages/jailed/ThirdPartyNotices.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Name packages
        run: |
          cp artifacts/gotohp-tweak-rootless/*.deb gotohp-tweak-rootless.deb
          cp artifacts/gotohp-tweak-rootful/*.deb gotohp-tweak-rootful.deb
          cp artifacts/gotohp-tweak-jailed/jailed/*.deb gotohp-tweak-jailed.deb
          cp artifacts/gotohp-tweak-jailed/jailed/GunshotJailed.dylib GunshotJailed.dylib
          cp artifacts/gotohp-tweak-jailed/jailed/ThirdPartyNotices.txt ThirdPartyNotices.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" gotohp-tweak-rootless.deb gotohp-tweak-rootful.deb gotohp-tweak-jailed.deb GunshotJailed.dylib ThirdPartyNotices.txt --generate-notes
